name: Publish Beta 3 gallery full resolution

on:
  push:
    branches:
      - main
    paths:
      - assets/fullres-gallery.ready

permissions:
  contents: write

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore full-resolution Beta 3 screenshots
        shell: bash
        run: |
          set -euo pipefail
          for name in Mixer Sound Turing Break-Slice Break-Texture; do
            cat assets/fullres/${name}.b64.* | tr -d '\n\r' | base64 -d > "TTG-DEV-BETA3-${name}.webp"
          done
          file TTG-DEV-BETA3-*.webp
          rm -rf assets/fullres assets/fullres-gallery.ready

      - name: Commit full-resolution gallery
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TTG-DEV-BETA3-*.webp
          git add -u assets 2>/dev/null || true
          git commit -m 'site: restore full-resolution Beta 3 screenshots'
          git push
