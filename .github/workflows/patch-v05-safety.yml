name: Patch Pocket flasher safety lock for v0.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v05-safety.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add verified v0.5 SHA to safety lock
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pocket-master-flasher/app.mjs')
          s=p.read_text()
          sha='8b5932a1efb36044218d9b5186060541a990acbee60493b7aac688e5e322e9e9'
          label='TTG FX CLEAN ROOT UI ABI FIXED v0.5 · stock parent ABI verified'
          if sha not in s:
              needle='const TARGETS = new Map([\n'
              if needle not in s:
                  raise SystemExit('TARGETS map anchor not found')
              s=s.replace(needle, needle+f"  ['{sha}', '{label}'],\n", 1)
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pocket-master-flasher/app.mjs
          if git diff --cached --quiet; then
            echo 'Safety lock already contains v0.5.'
          else
            git commit -m 'Allow TTG FX root UI ABI fixed v0.5 in flasher'
            git push origin main
          fi