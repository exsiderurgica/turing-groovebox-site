name: Stage TTG Beta 6 APK

on:
  push:
    branches:
      - release/beta6-site
    paths:
      - '.github/workflows/stage-beta6-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/beta6-site
      - name: Fetch signed Beta 6 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-b4cc-820a-ab41-128a69a68b1c/raw?se=2026-09-28T07%3A21%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=2d22cf0d-65b0-519f-88d6-299bb38fd5b4&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T06%3A40%3A32Z&ske=2026-09-29T06%3A40%3A32Z&sks=b&skv=2026-02-06&sig=i1fBH8c1sdcvnrKleVOZ9hq3cXv%2BYD20/Kveflj80xs%3D' -o /tmp/beta6.zip
          mkdir -p /tmp/beta6
          unzip -q /tmp/beta6.zip -d /tmp/beta6
          test -s /tmp/beta6/TTG-BETA6-B126-STABLE-signed.apk
          cp /tmp/beta6/TTG-BETA6-B126-STABLE-signed.apk TTG-BETA6.apk
          echo "0ea39db3f2fb3622edf01d71fb6271370420118f9c172412e3e988ac6d9b0360  TTG-BETA6.apk" | sha256sum -c -
      - name: Commit signed APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TTG-BETA6.apk
          git diff --cached --quiet || git commit -m "Publish TTG Beta 6 signed APK"
          git push origin HEAD:release/beta6-site
