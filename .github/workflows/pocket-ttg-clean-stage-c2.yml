name: Pocket TTG FX direct-chain milestone v0.2

on:
  push:
    branches: [pocket-ttg-clean]
    paths:
      - 'pocket-ttg-clean/stage_c2/**'
      - '.github/workflows/pocket-ttg-clean-stage-c2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pocket-ttg-clean

      - name: Download and verify official V1.3.3 only
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 -o pocket-fw.zip 'https://cdn.shopify.com/s/files/1/0100/1950/4185/files/Pocket_Master_Firmware_V1.3.3.zip?v=1751507074'
          python3 - <<'PY'
          import zipfile,pathlib,hashlib
          EXPECT='d9112f12a37e3731e540b325d2b9788f005de7f640c129ac30465ea1dc57e7a3'
          z=zipfile.ZipFile('pocket-fw.zip'); bins=[n for n in z.namelist() if n.lower().endswith('.bin')]
          assert len(bins)==1,bins
          raw=z.read(bins[0]); sha=hashlib.sha256(raw).hexdigest(); print(sha)
          assert sha==EXPECT,(sha,EXPECT)
          pathlib.Path('Pocket_Master_Firmware_V1.3.3.bin').write_bytes(raw)
          PY

      - name: Install NDS32 toolchain and Pillow
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd libgmp10 libmpfr6 libmpc3 libisl23 zlib1g libzstd1 libdebuginfod1
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          BINUTILS_URL='https://geo.mirror.pkgbuild.com/extra/os/x86_64/nds32le-elf-binutils-2.45.1-1-x86_64.pkg.tar.zst'
          GCC_URL='https://geo.mirror.pkgbuild.com/extra/os/x86_64/nds32le-elf-gcc-15.2.0-1-x86_64.pkg.tar.zst'
          curl -fL --retry 4 "$BINUTILS_URL" -o /tmp/binutils.pkg.tar.zst
          curl -fL --retry 4 "$GCC_URL" -o /tmp/gcc.pkg.tar.zst
          mkdir -p /tmp/nds32
          tar --zstd -xf /tmp/binutils.pkg.tar.zst -C /tmp/nds32
          tar --zstd -xf /tmp/gcc.pkg.tar.zst -C /tmp/nds32
          echo '/tmp/nds32/usr/bin' >> "$GITHUB_PATH"

      - name: Compile new NDS32 direct-chain shell
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/tmp/nds32/usr/bin:$PATH"
          mkdir -p build
          COMMON='-ffreestanding -fno-builtin -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -fdata-sections -ffunction-sections -fno-pic -fno-common -Os -Wall -Wextra -mcpu=d1088 -mabi=2'
          nds32le-elf-gcc $COMMON -c pocket-ttg-clean/stage_c2/ttg_shell.c -o build/ttg_shell.o
          nds32le-elf-gcc $COMMON -c pocket-ttg-clean/stage_c2/patch_sites.S -o build/patch_sites.o
          nds32le-elf-gcc -nostdlib -nodefaultlibs -nostartfiles -mcpu=d1088 -mabi=2 -Wl,--gc-sections -Wl,-T,pocket-ttg-clean/stage_c2/ttg_shell.ld build/ttg_shell.o build/patch_sites.o -o build/ttg_shell.elf
          nds32le-elf-readelf -h -S -l -A -r build/ttg_shell.elf > build/ttg_shell.elfinfo
          nds32le-elf-objdump -dr build/ttg_shell.elf > build/ttg_shell.dis
          nds32le-elf-nm -n build/ttg_shell.elf > build/ttg_shell.nm
          if nds32le-elf-readelf -r build/ttg_shell.elf | grep -q 'R_NDS32_'; then echo 'unresolved relocation' >&2; exit 1; fi
          for sec in patch_page2 patch_pre patch_next patch_enc_down patch_enc_up patch_enc_press ttg_hook; do
            nds32le-elf-objcopy -O binary --only-section=.$sec build/ttg_shell.elf build/$sec.bin
          done
          wc -c build/*.bin

      - name: Build firmware directly from official stock
        shell: bash
        run: |
          set -euxo pipefail
          python3 pocket-ttg-clean/stage_c2/build_stage_c2.py \
            Pocket_Master_Firmware_V1.3.3.bin \
            Pocket_TTG_FX_DIRECT_CHAIN_M1_v0.2.bin \
            --page2 build/patch_page2.bin \
            --pre build/patch_pre.bin \
            --next build/patch_next.bin \
            --enc-down build/patch_enc_down.bin \
            --enc-up build/patch_enc_up.bin \
            --enc-press build/patch_enc_press.bin \
            --hook build/ttg_hook.bin \
            --manifest Pocket_TTG_FX_DIRECT_CHAIN_M1_v0.2.json
          sha256sum Pocket_Master_Firmware_V1.3.3.bin Pocket_TTG_FX_DIRECT_CHAIN_M1_v0.2.bin | tee build/SHA256SUMS.txt

      - name: Upload milestone firmware and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pocket-ttg-direct-chain-m1-v0.2
          path: |
            Pocket_TTG_FX_DIRECT_CHAIN_M1_v0.2.bin
            Pocket_TTG_FX_DIRECT_CHAIN_M1_v0.2.json
            build/ttg_shell.dis
            build/ttg_shell.nm
            build/ttg_shell.elfinfo
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
