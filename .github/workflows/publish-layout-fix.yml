name: Publish TTG DEV BETA 3 APK

on:
  push:
    branches:
      - main
    paths:
      - transfer/beta3.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v6

      - name: Rebuild signed DEV Beta 3 APK from transfer chunks
        shell: bash
        run: |
          set -e
          cat transfer/beta3.part* | base64 -d > TTG-DEV-BETA3.apk
          echo '98901c37add1e6d89606adf478929a839307a096df5098927cb57a0bbe03e1e9  TTG-DEV-BETA3.apk' | sha256sum -c -
          sha256sum TTG-DEV-BETA3.apk > SHA256.txt
          if [ -f TTG-Manual.pdf ]; then sha256sum TTG-Manual.pdf >> SHA256.txt; fi

      - name: Publish signed DEV Beta 3
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TTG-DEV-BETA3.apk SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Publish signed TTG DEV Beta 3 build 1'
          git push
