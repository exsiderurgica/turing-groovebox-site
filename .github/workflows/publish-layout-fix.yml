name: Publish TTG layout fix APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-layout-fix.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v6

      - name: Download latest signed layout fix artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/exsiderurgica/turing-groovebox/actions/artifacts/10153107361/zip \
            > /tmp/layout-fix.zip
          mkdir -p /tmp/layout-fix
          unzip -o /tmp/layout-fix.zip -d /tmp/layout-fix
          APK=$(find /tmp/layout-fix -type f -name 'TTG-R16-STABLE-LAYOUT-FIX-signed.apk' -print -quit)
          test -n "$APK"
          cp "$APK" TTG-R16-BREAK-SYNC-DEFAULTS-TEST-signed.apk
          sha256sum TTG-R16-BREAK-SYNC-DEFAULTS-TEST-signed.apk

      - name: Replace site APK
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TTG-R16-BREAK-SYNC-DEFAULTS-TEST-signed.apk
          git diff --cached --quiet && exit 0
          git commit -m 'Replace site APK with latest R16 stable layout fix'
          git push
