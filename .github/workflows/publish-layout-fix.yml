name: Publish TTG DEV BETA 3 APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-layout-fix.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v6

      - name: Download signed DEV Beta 3 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/exsiderurgica/turing-groovebox/actions/artifacts/10296550713/zip \
            > /tmp/ttg-beta3.zip
          mkdir -p /tmp/ttg-beta3
          unzip -o /tmp/ttg-beta3.zip -d /tmp/ttg-beta3
          APK=$(find /tmp/ttg-beta3 -type f -name 'TTG-DEV-BETA3.apk' -print -quit)
          SIG=$(find /tmp/ttg-beta3 -type f -name 'SIGNATURE-INFO.txt' -print -quit)
          test -n "$APK"
          test -n "$SIG"
          cp "$APK" TTG-DEV-BETA3.apk
          cp "$SIG" SIGNATURE-INFO.txt
          sha256sum TTG-DEV-BETA3.apk > SHA256.txt
          if [ -f TTG-Manual.pdf ]; then sha256sum TTG-Manual.pdf >> SHA256.txt; fi

      - name: Publish signed DEV Beta 3
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TTG-DEV-BETA3.apk SIGNATURE-INFO.txt SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Publish signed TTG DEV Beta 3 build 1'
          git push
