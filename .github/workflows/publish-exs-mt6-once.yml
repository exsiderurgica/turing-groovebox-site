name: Publish verified EXS MT6 GOLD and previous P7708
on:
  push:
    branches: [publish/exs-mt6-p7710-gold]
    paths:
      - 'tools/publish_exs_mt6.py'
      - '.github/workflows/publish-exs-mt6-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOLD_ZIP: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-c708-820a-abfd-0b2f439aecec/raw?se=2026-11-15T21%3A59%3A18Z&sp=r&sv=2026-06-06&sr=b&scid=a1b86bb4-f016-5f87-9b92-d822f170e429&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-15T06%3A20%3A43Z&ske=2026-11-16T06%3A20%3A43Z&sks=b&skv=2026-06-06&sig=5bA3L1mxjGIZ7l/BxqON3R/%2B9p6NKHT4ml/Dtg6DztM%3D"
      OLD_ZIP: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-383c-820a-b432-849c300c4a1e/raw?se=2026-11-15T21%3A59%3A18Z&sp=r&sv=2026-06-06&sr=b&scid=4aa84b62-f4b3-5267-ada4-235b80197ef6&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-15T04%3A55%3A40Z&ske=2026-11-16T04%3A55%3A40Z&sks=b&skv=2026-06-06&sig=IVipYDhoNbea51DS/On/qP1PrCFR2yw7nCtImoUMCsM%3D"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch immutable CI-verified firmware archives
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --connect-timeout 20 "$GOLD_ZIP" -o /tmp/exs-mt6-p7710.zip
          curl -fLsS --retry 2 --connect-timeout 20 "$OLD_ZIP" -o /tmp/exs-mt4-p7708.zip
          unzip -t /tmp/exs-mt6-p7710.zip | tail -1
          unzip -t /tmp/exs-mt4-p7708.zip | tail -1
      - name: Update all current public MT6 pages, graphics, manual and flasher
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/publish_exs_mt6.py
      - name: Extract and verify exactly the two firmware binaries
        shell: bash
        run: |
          set -euo pipefail
          unzip -p /tmp/exs-mt6-p7710.zip felucca-1.0-p7710.fwsc > mt6/EXS_MT6_P7710_GOLD.fwsc
          unzip -p /tmp/exs-mt4-p7708.zip felucca-0.8-p7708.fwsc > mt6/EXS_MT4_P7708_GOLD.fwsc
          test "$(wc -c < mt6/EXS_MT6_P7710_GOLD.fwsc)" -eq 610201
          test "$(wc -c < mt6/EXS_MT4_P7708_GOLD.fwsc)" -eq 610201
          echo "fc9c52601f07ed3ecab3ece493b855c3781f8606b3541b65873db74fa846fc6e  mt6/EXS_MT6_P7710_GOLD.fwsc" | sha256sum -c -
          echo "e21586d0fcb3921a63693f756867abd77b4ac926f0c22565070dbd94294cceae  mt6/EXS_MT4_P7708_GOLD.fwsc" | sha256sum -c -
      - name: Validate checksum pins, JS and 6-voice website content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          h="fc9c52601f07ed3ecab3ece493b855c3781f8606b3541b65873db74fa846fc6e"
          fw=Path("mt6/EXS_MT6_P7710_GOLD.fwsc").read_bytes()
          m=json.loads(Path("mt6-flasher/release.json").read_text())
          assert hashlib.sha256(fw).hexdigest()==h==m["sha256"]
          assert m["product"]=="FM-1_910"
          assert m["firmware_url"]=="../mt6/EXS_MT6_P7710_GOLD.fwsc"
          site=Path("mt6/index.html").read_text()
          manual=Path("mt6/manual/index.html").read_text()
          assert '<text x="417"' in site and '>EXS/MT6</text>' in site
          assert '6× Macro' in site and '6× Turing' in site and '12× LFO' in site
          assert 'HYBRID 3+3' in site and 'P7.7.1.0' in manual
          assert h in site and h in Path("mt6/flash.mjs").read_text()
          print("PASS all current site labels, graphics, specs and GOLD manifest")
          PY
          node --check mt6/flash.mjs
          node --check mt6/site.mjs
          node --check mt6/stats.mjs
          node --check mt6-flasher/app.mjs
          node --experimental-default-type=module --test mt6-flasher/fwsc-check.test.mjs
      - name: Commit source site and exact GOLD binaries back to release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Workflow edits need a separate privileged GitHub connector commit;
          # this job publishes site/firmware files only.
          git restore --staged .github/workflows/mt4-universal-flasher-check.yml .github/workflows/verify-mt4-p7685-gold.yml
          git restore .github/workflows/mt4-universal-flasher-check.yml .github/workflows/verify-mt4-p7685-gold.yml
          git commit -m "publish(mt6): official P7710 GOLD with verified .fwsc, P7708 rollback and updated site"
          git push origin HEAD:publish/exs-mt6-p7710-gold
