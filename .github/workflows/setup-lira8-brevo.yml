name: Setup LIRA8 Brevo List

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/setup-lira8-brevo.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Create or find LIRA8 Updates list
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${BREVO_API_KEY:-}" ]; then
            echo "BREVO_API_KEY secret is not configured."
            exit 2
          fi

          headers=(-H "accept: application/json" -H "api-key: ${BREVO_API_KEY}" -H "content-type: application/json")

          lists=$(curl -fsS "https://api.brevo.com/v3/contacts/lists?limit=50&offset=0&sort=desc" "${headers[@]}")
          list_id=$(echo "$lists" | jq -r '.lists[]? | select(.name=="LIRA8 Updates") | .id' | head -n1)

          if [ -z "$list_id" ] || [ "$list_id" = "null" ]; then
            ttg=$(curl -fsS "https://api.brevo.com/v3/contacts/lists/3" "${headers[@]}")
            folder_id=$(echo "$ttg" | jq -r '.folderId')

            if [ -z "$folder_id" ] || [ "$folder_id" = "null" ]; then
              echo "Could not resolve Brevo folder from TTG list 3."
              exit 3
            fi

            created=$(curl -fsS -X POST "https://api.brevo.com/v3/contacts/lists" "${headers[@]}" \
              --data "$(jq -nc --arg name "LIRA8 Updates" --argjson folderId "$folder_id" '{name:$name,folderId:$folderId}')")
            list_id=$(echo "$created" | jq -r '.id')
          fi

          current=$(curl -fsS "https://api.brevo.com/v3/contacts/lists/${list_id}" "${headers[@]}")
          mkdir -p lira8
          echo "$current" | jq '{name:.name,list_id:.id,folder_id:.folderId,total_subscribers:(.totalSubscribers // 0),unique_subscribers:(.uniqueSubscribers // 0),provider:"Brevo"}' > lira8/brevo-list.json
          echo "LIRA8 Brevo list ID: $list_id"

      - name: Record LIRA8 Brevo list metadata
        run: |
          if git diff --quiet -- lira8/brevo-list.json; then
            echo "No metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lira8/brevo-list.json
          git commit -m "Configure LIRA8 Brevo list"
          git push