name: Build TTG Manual PDF

on:
  push:
    paths:
      - 'tools/build_ttg_manual.py'
      - 'manual/index.html'
      - 'release.json'
      - 'gallery_src/**'
      - '.github/workflows/build-ttg-manual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab pillow
      - name: Build Beta 6 manual
        run: |
          set -euo pipefail
          python tools/build_ttg_manual.py
          test -s TTG-Manual.pdf
          test -s TTG-BETA6.apk
          sha256sum TTG-BETA6.apk > SHA256.txt
          sha256sum TTG-Manual.pdf >> SHA256.txt
      - name: Render PDF verification preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p /tmp/manual-preview
          pdfinfo TTG-Manual.pdf | grep -E 'Pages|Page size'
          pdftoppm -png -r 120 TTG-Manual.pdf /tmp/manual-preview/page >/dev/null 2>&1
          test "$(find /tmp/manual-preview -name 'page-*.png' | wc -l)" -ge 8
      - name: Upload PDF verification preview
        uses: actions/upload-artifact@v4
        with:
          name: TTG-BETA6-MANUAL-PREVIEW
          path: /tmp/manual-preview/page-*.png
          if-no-files-found: error
      - name: Commit PDF and checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TTG-Manual.pdf SHA256.txt
          git diff --cached --quiet || git commit -m "Build TTG Beta 6 manual PDF"
          git push origin HEAD:${GITHUB_REF_NAME}
