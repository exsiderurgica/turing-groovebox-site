name: Build TTG Manual PDF

on:
  push:
    paths:
      - 'tools/build_ttg_manual.py'
      - 'Screenshot_20260910-015633.png'
      - 'Screenshot_20260910-014315.png'
      - 'Screenshot_20260910-015644.png'
      - 'Screenshot_20260910-015638.png'
      - 'Screenshot_20260910-015635.png'
      - '.github/workflows/build-ttg-manual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - run: python tools/build_ttg_manual.py
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TTG-Manual.pdf
          git diff --cached --quiet || git commit -m "Build updated TTG manual PDF"
          git push
