name: Pocket Master NDS32 compiler probe

on:
  push:
    branches: [pocket-ui-re]
    paths:
      - '.github/workflows/pocket-nds32-compiler-probe.yml'
      - 'pocket-re/compiler-probe/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pocket-ui-re

      - name: Install runtime dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd libgmp10 libmpfr6 libmpc3 libisl23 zlib1g libzstd1 libdebuginfod1

      - name: Download Arch NDS32 GCC + binutils
        run: |
          set -euxo pipefail
          BINUTILS_URL='https://geo.mirror.pkgbuild.com/extra/os/x86_64/nds32le-elf-binutils-2.45.1-1-x86_64.pkg.tar.zst'
          GCC_URL='https://geo.mirror.pkgbuild.com/extra/os/x86_64/nds32le-elf-gcc-15.2.0-1-x86_64.pkg.tar.zst'
          curl -fL --retry 4 "$BINUTILS_URL" -o /tmp/binutils.pkg.tar.zst
          curl -fL --retry 4 "$GCC_URL" -o /tmp/gcc.pkg.tar.zst
          mkdir -p /tmp/nds32
          tar --zstd -xf /tmp/binutils.pkg.tar.zst -C /tmp/nds32
          tar --zstd -xf /tmp/gcc.pkg.tar.zst -C /tmp/nds32
          echo "/tmp/nds32/usr/bin" >> "$GITHUB_PATH"

      - name: Inspect compiler target
        run: |
          set -euxo pipefail
          export PATH="/tmp/nds32/usr/bin:$PATH"
          nds32le-elf-gcc -dumpmachine | tee gcc-dumpmachine.txt
          nds32le-elf-gcc --version | tee gcc-version.txt
          nds32le-elf-gcc -Q --help=target 2>&1 | tee gcc-target-help.txt
          nds32le-elf-objdump --version | tee objdump-version.txt

      - name: Build freestanding ABI probes and linked GUI takeover callbacks
        run: |
          set -euxo pipefail
          export PATH="/tmp/nds32/usr/bin:$PATH"
          mkdir -p build

          cat > build/probe.c <<'EOF'
          #include <stdint.h>
          __attribute__((noinline,used)) int ttg_noop(void *ctx, int arg){(void)ctx;return arg+1;}
          __attribute__((noinline,used)) void ttg_store32(volatile uint32_t *p,uint32_t v){*p=v;}
          __attribute__((noinline,used)) uint32_t ttg_mix(uint32_t a,uint32_t b,uint32_t c,uint32_t d){return (a^b)+(c<<1)-d;}
          __attribute__((noinline,used)) float ttg_float(float a,float b){return a*0.5f+b;}
          EOF

          COMMON='-ffreestanding -fno-builtin -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -fdata-sections -ffunction-sections -Os -Wall -Wextra'
          build_one(){ name="$1";shift; nds32le-elf-gcc $COMMON "$@" -c build/probe.c -o "build/probe-$name.o"; nds32le-elf-objdump -dr "build/probe-$name.o" > "build/probe-$name.dis"; nds32le-elf-readelf -h -A "build/probe-$name.o" > "build/probe-$name.elfinfo"; }
          build_one d1088 -mcpu=d1088 -mabi=2
          build_one d1088-fpu-soft -mcpu=d1088-fpu -mabi=2 -mext-fpu-sp

          cat > build/gui_takeover.c <<'EOF'
          #include <stdint.h>
          __attribute__((used,section(".text.ttg_page2_enter"),noinline))
          uint32_t ttg_page2_enter(void *ctx, uint32_t param){(void)ctx;(void)param;return 0;}
          __attribute__((used,section(".text.ttg_page2_leave"),noinline))
          uint32_t ttg_page2_leave(void *ctx){(void)ctx;return 0;}
          __attribute__((used,section(".text.ttg_page2_event"),noinline))
          uint32_t ttg_page2_event(void *ctx){(void)ctx;return 0;}
          EOF

          cat > build/gui_takeover.ld <<'EOF'
          ENTRY(ttg_page2_enter)
          SECTIONS
          {
            . = 0x00022e80;
            .ttg_enter : { KEEP(*(.text.ttg_page2_enter)) }
            . = 0x000233e8;
            .ttg_leave : { KEEP(*(.text.ttg_page2_leave)) }
            . = 0x00023440;
            .ttg_event : { KEEP(*(.text.ttg_page2_event)) }
            /DISCARD/ : { *(.comment) *(.note*) *(.eh_frame*) }
          }
          EOF

          nds32le-elf-gcc $COMMON -mcpu=d1088 -mabi=2 -fno-pic -c build/gui_takeover.c -o build/gui_takeover.o
          nds32le-elf-gcc -nostdlib -nodefaultlibs -nostartfiles -mcpu=d1088 -mabi=2 -Wl,--gc-sections -Wl,-T,build/gui_takeover.ld build/gui_takeover.o -o build/gui_takeover.elf
          nds32le-elf-objdump -dr -Mintel build/gui_takeover.elf > build/gui_takeover.dis || nds32le-elf-objdump -dr build/gui_takeover.elf > build/gui_takeover.dis
          nds32le-elf-nm -n build/gui_takeover.elf > build/gui_takeover.nm
          nds32le-elf-readelf -h -S -l -A build/gui_takeover.elf > build/gui_takeover.elfinfo
          nds32le-elf-objcopy -O binary --only-section=.ttg_enter build/gui_takeover.elf build/ttg_page2_enter.bin
          nds32le-elf-objcopy -O binary --only-section=.ttg_leave build/gui_takeover.elf build/ttg_page2_leave.bin
          nds32le-elf-objcopy -O binary --only-section=.ttg_event build/gui_takeover.elf build/ttg_page2_event.bin

          printf 'Expected stock callback addresses:\n enter 0x22e80\n leave 0x233e8\n event 0x23440\n' > build/gui_takeover_map.txt
          wc -c build/ttg_page2_*.bin | tee -a build/gui_takeover_map.txt
          sha256sum build/* > build/SHA256SUMS.txt

      - name: Upload compiler probe
        uses: actions/upload-artifact@v4
        with:
          name: pocket-nds32-compiler-probe
          path: |
            gcc-*.txt
            objdump-version.txt
            build/
          retention-days: 30
