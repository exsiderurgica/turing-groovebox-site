name: Pocket Master NDS32 compiler probe

on:
  push:
    branches: [pocket-ui-re]
    paths:
      - '.github/workflows/pocket-nds32-compiler-probe.yml'
      - 'pocket-re/compiler-probe/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pocket-ui-re

      - name: Install runtime dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd libgmp10 libmpfr6 libmpc3 libisl23 zlib1g libzstd1 libdebuginfod1

      - name: Download Arch NDS32 GCC + binutils
        run: |
          set -euxo pipefail
          BINUTILS_URL='https://geo.mirror.pkgbuild.com/extra/os/x86_64/nds32le-elf-binutils-2.45.1-1-x86_64.pkg.tar.zst'
          GCC_URL='https://geo.mirror.pkgbuild.com/extra/os/x86_64/nds32le-elf-gcc-15.2.0-1-x86_64.pkg.tar.zst'
          curl -fL --retry 4 "$BINUTILS_URL" -o /tmp/binutils.pkg.tar.zst
          curl -fL --retry 4 "$GCC_URL" -o /tmp/gcc.pkg.tar.zst
          mkdir -p /tmp/nds32
          tar --zstd -xf /tmp/binutils.pkg.tar.zst -C /tmp/nds32
          tar --zstd -xf /tmp/gcc.pkg.tar.zst -C /tmp/nds32
          echo "/tmp/nds32/usr/bin" >> "$GITHUB_PATH"

      - name: Inspect compiler target
        run: |
          set -euxo pipefail
          export PATH="/tmp/nds32/usr/bin:$PATH"
          nds32le-elf-gcc -dumpmachine | tee gcc-dumpmachine.txt
          nds32le-elf-gcc --version | tee gcc-version.txt
          nds32le-elf-gcc -Q --help=target 2>&1 | tee gcc-target-help.txt
          nds32le-elf-objdump --version | tee objdump-version.txt

      - name: Build first custom page-2 takeover
        run: |
          set -euxo pipefail
          export PATH="/tmp/nds32/usr/bin:$PATH"
          mkdir -p build

          cat > build/gui_takeover.c <<'EOF'
          #include <stdint.h>
          #include <stddef.h>

          typedef void *(*ttg_get_screen_fn)(void);
          typedef void *(*ttg_create_text_fn)(void *parent);
          typedef void (*ttg_set_text_fn)(void *obj, const char *text);
          typedef void (*ttg_set_pos_fn)(void *obj, int32_t x, int32_t y);

          #define TTG_GET_SCREEN  ((ttg_get_screen_fn)(uintptr_t)0x0002cce0u)
          #define TTG_CREATE_TEXT ((ttg_create_text_fn)(uintptr_t)0x00047998u)
          #define TTG_SET_TEXT    ((ttg_set_text_fn)(uintptr_t)0x000479b8u)
          #define TTG_SET_POS     ((ttg_set_pos_fn)(uintptr_t)0x0002f15cu)

          __attribute__((used,section(".ttg_strings"),aligned(1)))
          static const char ttg_title[] = "TTG FX";
          __attribute__((used,section(".ttg_strings"),aligned(1)))
          static const char ttg_brand[] = "EXSIDERURGICA";
          __attribute__((used,section(".ttg_strings"),aligned(1)))
          static const char ttg_status[] = "CUSTOM UI CORE";

          static __attribute__((always_inline)) inline void add_text(void *parent, const char *s, int32_t x, int32_t y) {
              void *t = TTG_CREATE_TEXT(parent);
              if (t) {
                  TTG_SET_TEXT(t, s);
                  TTG_SET_POS(t, x, y);
              }
          }

          __attribute__((used,section(".text.ttg_page2_enter"),noinline))
          uint32_t ttg_page2_enter(void *ctx, uint32_t param) {
              (void)ctx;
              (void)param;
              void *screen = TTG_GET_SCREEN();
              if (!screen) return 0;
              add_text(screen, ttg_title, 12, 14);
              add_text(screen, ttg_brand, 12, 44);
              add_text(screen, ttg_status, 12, 74);
              return 0;
          }

          __attribute__((used,section(".text.ttg_page2_leave"),noinline))
          uint32_t ttg_page2_leave(void *ctx) {
              (void)ctx;
              return 0;
          }

          __attribute__((used,section(".text.ttg_page2_event"),noinline))
          uint32_t ttg_page2_event(void *ctx) {
              (void)ctx;
              return 0;
          }
          EOF

          cat > build/gui_takeover.ld <<'EOF'
          ENTRY(ttg_page2_enter)
          SECTIONS
          {
            . = 0x00022e80;
            .ttg_enter : { KEEP(*(.text.ttg_page2_enter)) }
            . = 0x00023080;
            .ttg_strings : { KEEP(*(.ttg_strings)) }
            . = 0x000233e8;
            .ttg_leave : { KEEP(*(.text.ttg_page2_leave)) }
            . = 0x00023440;
            .ttg_event : { KEEP(*(.text.ttg_page2_event)) }
            /DISCARD/ : { *(.comment) *(.note*) *(.eh_frame*) *(.data*) *(.bss*) }
          }
          ASSERT(SIZEOF(.ttg_enter) <= 0x200, "custom enter exceeds reserved code window")
          ASSERT(SIZEOF(.ttg_strings) <= 0x100, "custom strings exceed reserved window")
          ASSERT(SIZEOF(.ttg_leave) <= 0x58, "custom leave exceeds stock callback slot")
          ASSERT(SIZEOF(.ttg_event) <= 0x22e, "custom event exceeds stock callback slot")
          EOF

          COMMON='-ffreestanding -fno-builtin -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -fdata-sections -ffunction-sections -fno-pic -fno-common -fno-merge-constants -Os -Wall -Wextra -mcpu=d1088 -mabi=2 -G0'
          nds32le-elf-gcc $COMMON -c build/gui_takeover.c -o build/gui_takeover.o
          nds32le-elf-gcc -nostdlib -nodefaultlibs -nostartfiles -mcpu=d1088 -mabi=2 -Wl,--gc-sections -Wl,-T,build/gui_takeover.ld build/gui_takeover.o -o build/gui_takeover.elf
          nds32le-elf-objdump -dr build/gui_takeover.elf > build/gui_takeover.dis
          nds32le-elf-objdump -s build/gui_takeover.elf > build/gui_takeover.hex
          nds32le-elf-nm -n build/gui_takeover.elf > build/gui_takeover.nm
          nds32le-elf-readelf -h -S -l -A -r build/gui_takeover.elf > build/gui_takeover.elfinfo
          nds32le-elf-objcopy -O binary --only-section=.ttg_enter build/gui_takeover.elf build/ttg_page2_enter.bin
          nds32le-elf-objcopy -O binary --only-section=.ttg_strings build/gui_takeover.elf build/ttg_page2_strings.bin
          nds32le-elf-objcopy -O binary --only-section=.ttg_leave build/gui_takeover.elf build/ttg_page2_leave.bin
          nds32le-elf-objcopy -O binary --only-section=.ttg_event build/gui_takeover.elf build/ttg_page2_event.bin

          printf 'Patch map (runtime addresses in region b):\n enter   0x22e80\n strings 0x23080\n leave   0x233e8\n event   0x23440\n' > build/gui_takeover_map.txt
          wc -c build/ttg_page2_*.bin | tee -a build/gui_takeover_map.txt
          if grep -Eq 'R_NDS32|RELOCATION RECORDS FOR' build/gui_takeover.dis; then
            echo 'ERROR: unexpected unresolved relocation in final ELF' >&2
            exit 1
          fi
          sha256sum build/* > build/SHA256SUMS.txt

      - name: Upload compiler probe
        uses: actions/upload-artifact@v4
        with:
          name: pocket-nds32-compiler-probe
          path: |
            gcc-*.txt
            objdump-version.txt
            build/
          retention-days: 30
