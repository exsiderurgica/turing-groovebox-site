name: Publish EXS MT6 P7713 GOLD verified binary (one time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mt6-p7713-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch exact CI artifact and verify the firmware
        shell: bash
        env:
          SOURCE_ZIP: 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-6d3c-820c-b760-00a341651e71/raw?se=2026-11-16T12%3A18%3A14Z&sp=r&sv=2026-06-06&sr=b&scid=0d6d0272-9feb-5c02-8916-ecdd1f2f0f75&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-16T06%3A31%3A50Z&ske=2026-11-17T06%3A31%3A50Z&sks=b&skv=2026-06-06&sig=nLPm1ELy7aFBtu6/H8qyOgLJfrP2ybvTNwkUN7eckuA%3D'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --output /tmp/p7713-ci.zip "$SOURCE_ZIP"
          echo '19641c814947757fe8ded98a1e8a4f2fca6af989dec1b43dfddc8b218106891f  /tmp/p7713-ci.zip' | sha256sum --check
          unzip -p /tmp/p7713-ci.zip felucca-1.3-p7713.fwsc > mt6/EXS_MT6_P7713_GOLD.fwsc
          test "$(wc -c < mt6/EXS_MT6_P7713_GOLD.fwsc)" -eq 610201
          echo '9023ca2a3495fa579b18e4371f3757e21afbd9d8af0416b7c71bc0f4a753841a  mt6/EXS_MT6_P7713_GOLD.fwsc' | sha256sum --check
      - name: Commit verified original bytes (preserve older GOLD)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mt6/EXS_MT6_P7713_GOLD.fwsc
          git commit -m "release(mt6): archive verified P7713 GOLD firmware from CI (610201 bytes)"
          git push origin HEAD:main
