name: Verify published EXS MT4 P7.6.9.6 GOLD (current)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-mt4-p7685-gold.yml'
      - 'mt4/**'
      - 'mt4-flasher/release.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-mt4-p7685-gold.yml'
      - 'mt4/**'
      - 'mt4-flasher/release.json'
      - '.github/workflows/publish-mt4-p767-gold.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact immutable GOLD firmware and safe integrated flasher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          want='6de2e39b0a4a2f35bc563abb2433dee1a35c53f39dd0e32f9ceff14118e78cda'
          name='EXS_MT4_v030_P7696_USB_TRS_SYNC_GOLD.fwsc'
          path=Path('mt4')/name
          data=path.read_bytes()
          assert len(data)==610201,(len(data),)
          assert hashlib.sha256(data).hexdigest()==want
          rollback=Path('mt4/EXS_MT4_v030_P7687_DUAL_FLASH_GOLD.fwsc').read_bytes()
          assert len(rollback)==609927
          assert hashlib.sha256(rollback).hexdigest()=='6bc7c10c582afa90b69f3659a89924f705dc608f63037f4ec9c5bf0181ff7dbd'
          old=Path('mt4/EXS_MT4_v030_P7686_REGEN_FX_AMBIENT_START_GOLD.fwsc')
          assert len(old.read_bytes())==609912
          assert hashlib.sha256(old.read_bytes()).hexdigest()=='2b7f9cd975fe9f76da77d451a85640afb875983b28ad0c2fba7b9914f756b43b'
          release=json.loads(Path('mt4-flasher/release.json').read_text())
          assert release['release']=='MT4 v0.30 P7.6.9.6 GOLD'
          assert release['sha256']==want and release['size']==610201
          assert release['firmware_url']=='../mt4/'+name
          assert release['flash_enabled'] and release['ota_enabled'] and release['product']=='FM-1_996'
          flash=Path('mt4/flash.mjs').read_text()
          assert f"const SHA='{want}'" in flash
          assert f"const NAME='{name}'" in flash
          assert "P7.6.9.6 GOLD" in flash
          assert "compatibleDevice(identity,loaded.meta)" in flash
          assert "allowUnverifiedFelucca:false" in flash
          assert "inspectFwsc(raw,NAME)" in flash
          html=Path('mt4/index.html').read_text()
          manual=Path('mt4/manual/index.html').read_text()
          assert 'P7.6.9.6' in html and 'P7.6.9.6' in manual
          assert 'id="downloadBtn"' in html and 'id="flashBtn"' in html
          assert 'PAYPAL' in html.upper() and 'freeDownload' in html
          assert 'P7.6.9.6' in html and 'CONTROL ALL' in html
          assert want in html and '610,201 BYTES' in html
          assert '90%' in html and '90%' in manual
          assert 'USB IN' in manual and 'TRS IN' in manual and 'USB OUT' in manual
          assert 'Bluetooth' in manual and 'AUDIO LATE' in manual
          print('PASS MT4 P7696 GOLD binary SHA256, P7686 fallback archive, download/OTA, bilingual site')
          PY
          node --check mt4/flash.mjs
          node --check mt4/site.mjs
          node --check mt4-flasher/app.mjs
          node --test mt4-flasher/fwsc-check.test.mjs
