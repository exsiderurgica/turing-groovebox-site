name: Verify archived EXS MT4 P7.6.7 GOLD
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mt4-p767-gold.yml'
      - 'mt4/EXS_MT4_v030_P767_MUTABLE_PINGPONG_GOLD.fwsc'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify preserved previous GOLD binary (not the current release)
        run: |
          set -euo pipefail
          FILE="mt4/EXS_MT4_v030_P767_MUTABLE_PINGPONG_GOLD.fwsc"
          test "$(wc -c < "$FILE")" -eq 609912
          echo "7a47cbf3ad9fedf910c0f862940d94b29ec777523664e0c3f7664a636b8cd67e  $FILE" | sha256sum -c -
          echo "Previous P7.6.7 GOLD binary remains preserved"
