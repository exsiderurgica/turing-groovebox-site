name: Pocket TTG analyze page events
on:
  workflow_dispatch:
  push:
    branches: [pocket-ttg-clean]
    paths: ['.github/workflows/pocket-ttg-analyze-page-events.yml']
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pocket-ttg-clean
      - name: Get stock and NDS32 objdump
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 -o fw.zip 'https://cdn.shopify.com/s/files/1/0100/1950/4185/files/Pocket_Master_Firmware_V1.3.3.zip?v=1751507074'
          python3 - <<'PY'
          import zipfile,pathlib,hashlib
          z=zipfile.ZipFile('fw.zip'); n=[x for x in z.namelist() if x.lower().endswith('.bin')][0]; raw=z.read(n)
          assert hashlib.sha256(raw).hexdigest()=='d9112f12a37e3731e540b325d2b9788f005de7f640c129ac30465ea1dc57e7a3'
          pathlib.Path('stock.bin').write_bytes(raw)
          cnt=int.from_bytes(raw[0x22:0x24],'little'); base=0x38+cnt*16
          for i in range(cnt):
            e=0x38+i*16
            if chr(raw[e+3])=='b':
              o=base+int.from_bytes(raw[e+8:e+12],'little'); l=int.from_bytes(raw[e+12:e+16],'little')
              pathlib.Path('b.bin').write_bytes(raw[o:o+l]); print('B',hex(o),hex(l)); break
          PY
          sudo apt-get update -qq
          sudo apt-get install -y zstd libdebuginfod1 libzstd1 zlib1g libgmp10 libmpfr6 libmpc3 libisl23 >/dev/null
          curl -fL --retry 4 'https://geo.mirror.pkgbuild.com/extra/os/x86_64/nds32le-elf-binutils-2.45.1-1-x86_64.pkg.tar.zst' -o /tmp/binutils.pkg.tar.zst
          mkdir -p /tmp/nds32 && tar --zstd -xf /tmp/binutils.pkg.tar.zst -C /tmp/nds32
          echo '/tmp/nds32/usr/bin' >> "$GITHUB_PATH"
          /tmp/nds32/usr/bin/nds32le-elf-objdump -D -b binary -m nds32 --adjust-vma=0x10000 b.bin > stock_b.dis
      - name: Print page2 event and hardware sites
        shell: bash
        run: |
          set -euxo pipefail
          O=/tmp/nds32/usr/bin/nds32le-elf-objdump
          echo '=== PAGE2 EVENT 0x23440..0x23670 ==='
          $O -D -b binary -m nds32 --adjust-vma=0x10000 --start-address=0x23440 --stop-address=0x23670 b.bin
          for R in '52c20 53080' '53940 53d30' '14920 15360' '65980 65c20'; do set -- $R; echo "=== $1..$2 ==="; $O -D -b binary -m nds32 --adjust-vma=0x10000 --start-address=0x$1 --stop-address=0x$2 b.bin; done
      - name: Dump printable diagnostic strings by runtime address
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          b=Path('b.bin').read_bytes()
          ranges=[(0x0df000,0x0df400),(0x140f00,0x141500),(0x144100,0x144500)]
          for lo,hi in ranges:
            print(f'=== STRINGS runtime {lo:06x}..{hi:06x} ===')
            i=max(0,lo-0x10000); end=min(len(b),hi-0x10000)
            while i<end:
              j=i
              while j<end and 32<=b[j]<127: j+=1
              if j-i>=4:
                print(f'{i+0x10000:08x}:',b[i:j].decode('ascii','replace'))
              i=max(j+1,i+1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-stock-page-event-analysis
          path: |
            stock_b.dis
            b.bin
          retention-days: 7
