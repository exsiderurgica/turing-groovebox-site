name: Publish MT4 P7.5.9 GOLD to website
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mt4-p759-gold.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mt4-p759-site-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact SHA-verified GOLD binary from EXS-FM1
        run: |
          set -euo pipefail
          mkdir -p mt4
          # Temporary one-use signed download for the exact private build artifact.
          # The ZIP is verified against the immutable P759 SHA before publication.
          SOURCE="https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-107c-820a-8d55-821b6b5f6205/raw?se=2026-11-01T18%3A06%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=7be9e7ff-3273-5e87-a470-dc40789510df&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T08%3A21%3A57Z&ske=2026-11-02T08%3A21%3A57Z&sks=b&skv=2026-02-06&sig=9vI3vDD/8PjlGa9Ipu8rTfYkxm8t5dbWdaZ2su/cvJ4%3D"
          DEST="mt4/EXS_MT4_v030_P759_STRING_EXTRA_LIVE_REGEN_GOLD.fwsc"
          curl -fLsS --retry 3 --retry-delay 2 --connect-timeout 12 --max-time 90 "$SOURCE" -o /tmp/p759-source.zip
          unzip -p /tmp/p759-source.zip "EXS-MT4-v0.30-P7.5.9-STRING-EXTRA-LIVE-REGEN-EXPERIMENTAL.fwsc" > "$DEST"
          test "$(wc -c < "$DEST")" -eq 609912
          echo "30d6738118e269087d32917ba5c5bbcb25d45f9417f5e8c203b5adb0d4c3751e  $DEST" | sha256sum -c -
          echo "Website GOLD binary validated"
      - name: Commit firmware to GitHub Pages published directory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f mt4/EXS_MT4_v030_P759_STRING_EXTRA_LIVE_REGEN_GOLD.fwsc
          if git diff --cached --quiet; then
            echo "Already available on the MT4 site"
          else
            git commit -m "site(MT4): host P7.5.9 GOLD flashable firmware with verified SHA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
