name: Verify published MT4 P7.5.9 GOLD on website
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mt4-p759-gold.yml'
      - 'mt4/EXS_MT4_v030_P759_STRING_EXTRA_LIVE_REGEN_GOLD.fwsc'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify published GOLD firmware length and SHA-256
        run: |
          set -euo pipefail
          FILE="mt4/EXS_MT4_v030_P759_STRING_EXTRA_LIVE_REGEN_GOLD.fwsc"
          test "$(wc -c < "$FILE")" -eq 609912
          echo "30d6738118e269087d32917ba5c5bbcb25d45f9417f5e8c203b5adb0d4c3751e  $FILE" | sha256sum -c -
          node --check mt4/flash.mjs
          grep -q 'P7.5.9' mt4/index.html
          echo "P7.5.9 GOLD site release verified"
