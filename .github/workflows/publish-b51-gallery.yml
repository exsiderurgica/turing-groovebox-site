name: Validate TTG gallery

on:
  push:
    branches: [main]
    paths:
      - 'gallery/**'
      - 'screenshots.json'
      - '.github/workflows/publish-b51-gallery.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate permanent gallery
        shell: bash
        run: |
          set -euo pipefail
          for f in gallery/mixer.webp gallery/sound.webp gallery/turing.webp gallery/break.webp; do
            test -s "$f"
            file "$f" | grep -qi 'Web/P'
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path('screenshots.json').read_text())
          expected=[
            ('MIXER','gallery/mixer.webp'),
            ('SOUND','gallery/sound.webp'),
            ('TURING','gallery/turing.webp'),
            ('BREAK','gallery/break.webp'),
          ]
          items=data.get('items',[])
          assert len(items)==4, f'expected 4 screenshots, got {len(items)}'
          for item,(title,path) in zip(items,expected):
            assert item.get('title')==title
            src=item.get('src','').split('?',1)[0]
            assert src==path, f'{title}: {src} != {path}'
            assert Path(path).stat().st_size > 1000
          print('TTG gallery OK')
          PY
